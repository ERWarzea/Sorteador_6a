<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sorteador de Times Resenha Futs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 10px; background-color: #f0f2f5; color: #1c1e21; }
        .container { max-width: 800px; margin: 0 auto; background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1, h2 { color: #007bff; }
        h1 { font-size: 1.8em; text-align: center; }
        h2 { border-bottom: 2px solid #007bff; padding-bottom: 8px; margin-top: 30px; font-size: 1.4em; }
        textarea { width: 100%; height: 140px; margin-bottom: 10px; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 1em; }
        button { display: block; width: 100%; padding: 15px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 6px; font-size: 1.2em; font-weight: bold; margin-bottom: 15px; transition: background-color 0.3s; }
        button:hover { background-color: #0056b3; }
        #sortearBtn { background-color: #28a745; }
        #sortearBtn:hover { background-color: #218838; }
        .jogador-item { padding: 10px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .jogador-info { display: flex; align-items: center; }
        .jogador-item .level-label { font-weight: bold; margin-left: 10px; }
        .pontualidade-group { margin-left: 15px; }
        .time { margin-top: 20px; border: 1px solid #007bff; padding: 15px; border-radius: 8px; background-color: #f8f9fa; }
        .time h4 { margin-top: 0; color: #007bff; font-size: 1.2em; }
        .time ul { list-style-type: none; padding-left: 0; }
        .time li { margin-bottom: 5px; font-size: 1.1em; font-weight: 500; }
        .nivel-4 { color: #dc3545; }
        .nivel-3 { color: #fd7e14; }
        .nivel-2 { color: #007bff; }
        .nivel-1 { color: #6c757d; }
        .contadores { padding: 15px; background-color: #e9ecef; border-radius: 6px; margin-bottom: 20px; display: flex; justify-content: space-around; flex-wrap: wrap; text-align: center; }
        .contador-item { margin: 5px 10px; }
        .contador-item strong { font-size: 1.5em; color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sorteador de Times Resenha Futs</h1>
        <h2>Passo 1: Lista de Jogadores</h2>
        <textarea id="textoWhatsapp" placeholder="Cole aqui a mensagem de confirmação do WhatsApp..."></textarea>
        <button onclick="processarLista()">Processar Lista</button>
        <h2>Passo 2: Confirmação e Bônus</h2>
        <div id="jogadoresProcessados"><p>A lista de jogadores aparecerá aqui.</p></div>
        <div id="contadores" class="contadores" style="display: none;"></div>
        <button id="sortearBtn" onclick="iniciarSorteio()" style="display: none;">INICIAR SORTEIO</button>
        <h2>Passo 3: Resultado do Sorteio</h2>
        <div id="resultadoSorteio"></div>
    </div>
    
    <script>
        const NIVEIS_DE_HABILIDADE = { 'Anderson': 4, 'Junior': 4, 'Kleber': 4, 'Elivelton': 3, 'Felipe': 3, 'Jajá': 3, 'Rodolfo': 3, 'Willians': 3, 'Claudinei': 2, 'Dudinha': 2, 'Jonathan': 2, 'Lucas': 2, 'Matheus C': 2, 'Matheus Rosq': 2, 'Vitor': 2, 'Elio': 1, 'Cabelinho': 1, 'Gilson': 1, 'Kauê': 1, 'Rafael': 1, };

        function extrairConfirmados(texto) {
            const confirmados = new Set();
            const regexLinha = /^\s*\d+\.\s*(.+)/gm;
            let match;
            while ((match = regexLinha.exec(texto)) !== null) {
                const linhaInteira = match[1];
                // SÓ ADICIONA À LISTA SE TIVER O CHECK DE CONFIRMADO
                if (linhaInteira.includes('✅')) {
                    // Limpa todos os emojis e excessos da linha
                    const nomeLimpo = linhaInteira.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').trim();
                    if (nomeLimpo) confirmados.add(nomeLimpo);
                }
            }
            return Array.from(confirmados);
        }


        function processarLista() {
            const nomes = extrairConfirmados(document.getElementById('textoWhatsapp').value);
            if (nomes.length === 0) { alert("Nenhum jogador confirmado com ✅ encontrado na lista."); return; }
            const jogadores = nomes.map(nome => ({ nome: nome, nivel: NIVEIS_DE_HABILIDADE[nome] || 2 }));
            renderizarListaConfirmacao(jogadores);
            atualizarContadores();
        }

        function renderizarListaConfirmacao(jogadores) {
            const div = document.getElementById('jogadoresProcessados');
            div.innerHTML = '<h3>Jogadores Confirmados</h3>';
            jogadores.sort((a,b) => a.nome.localeCompare(b.nome));
            jogadores.forEach(j => {
                div.innerHTML += `
                    <div class="jogador-item" data-nome="${j.nome}" data-nivel="${j.nivel}">
                        <div class="jogador-info">
                            <input type="checkbox" name="presente-${j.nome}" checked onchange="atualizarContadores()">
                            <label for="presente-${j.nome}">${j.nome}</label>
                            <span class="level-label nivel-${j.nivel}">Nível ${j.nivel}</span>
                        </div>
                        <div class="pontualidade-group">
                            <input type="checkbox" name="pontual-${j.nome}" onchange="atualizarContadores()">
                            <label for="pontual-${j.nome}">Bônus (★)</label>
                        </div>
                    </div>`;
            });
            document.getElementById('sortearBtn').style.display = 'block';
            document.getElementById('contadores').style.display = 'flex';
        }

        function atualizarContadores() {
            const presentes = document.querySelectorAll('input[name^="presente"]:checked').length;
            const comBonus = document.querySelectorAll('input[name^="pontual"]:checked').length;
            let timesTexto = '0';
            if (presentes >= 5) {
                const timesCompletos = Math.floor(presentes / 5);
                const resto = presentes % 5;
                timesTexto = `${timesCompletos}`;
                if (resto > 0) { timesTexto += ` (+${resto} próx.)`; }
            }
            document.getElementById('contadores').innerHTML = `<div class="contador-item"><span>Confirmados</span><br><strong>${document.querySelectorAll('.jogador-item').length}</strong></div><div class="contador-item"><span>Presentes</span><br><strong>${presentes}</strong></div><div class="contador-item"><span>Times</span><br><strong>${timesTexto}</strong></div><div class="contador-item"><span>Bônus ★</span><br><strong>${comBonus}</strong></div>`;
        }

        function coletarDadosFinais() {
             const lista = [];
             document.querySelectorAll('.jogador-item').forEach(item => {
                if (item.querySelector('input[name^="presente"]:checked')) {
                    lista.push({ nome: item.dataset.nome, nivel: parseInt(item.dataset.nivel), pontual: item.querySelector('input[name^="pontual"]:checked') ? true : false, });
                }
             });
             return lista;
        }
        
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; }
            return array;
        }
        
        function iniciarSorteio() {
            const jogadoresPresentes = coletarDadosFinais();
            const N = jogadoresPresentes.length;
            if (N < 5) { alert(`Mínimo de 5 jogadores necessários.`); return; }
            const pontuais = jogadoresPresentes.filter(j => j.pontual);
            if (pontuais.length > 8) { alert(`ERRO: Máximo de 8 jogadores com bônus.`); return; }
            const bonusPorNivel = pontuais.reduce((acc, j) => { (acc[j.nivel] = (acc[j.nivel] || 0) + 1); return acc; }, {});
            for (const nivel in bonusPorNivel) { if (bonusPorNivel[nivel] > 2) { alert(`ERRO: O Nível ${nivel} tem mais de 2 com bônus.`); return; } }

            const resto = N % 5;
            let jogadoresParaSorteio = [...jogadoresPresentes];
            let grupoDosProximos = [];
            if (resto > 0) {
                const candidatos = shuffleArray(jogadoresPresentes.filter(j => !j.pontual));
                grupoDosProximos = candidatos.slice(0, resto);
                const nomesDosProximos = new Set(grupoDosProximos.map(j => j.nome));
                jogadoresParaSorteio = jogadoresPresentes.filter(j => !nomesDosProximos.has(j.nome));
            }
            
            const numeroDeTimes = Math.floor(jogadoresParaSorteio.length / 5);
            let times = Array.from({ length: numeroDeTimes }, (_, i) => ({ id: i + 1, jogadores: [] }));
            const listaRepescagem = [];
            
            let pontuaisSorteio = jogadoresParaSorteio.filter(j => j.pontual);
            let regularesSorteio = jogadoresParaSorteio.filter(j => !j.pontual);
            const timeInicialRegular = (pontuaisSorteio.length > 0) ? 2 : 0;

            for (let nivel = 4; nivel >= 1; nivel--) {
                const pontuaisDoNivel = pontuaisSorteio.filter(j => j.nivel === nivel);
                let regularesDoNivel = regularesSorteio.filter(j => j.nivel === nivel);
                
                if (pontuaisDoNivel.length === 1) {
                    const parForcado = regularesDoNivel.shift();
                    if (parForcado) {
                        let par = shuffleArray([pontuaisDoNivel[0], parForcado]);
                        times[0].jogadores.push(par[0]);
                        times[1].jogadores.push(par[1]);
                        regularesSorteio = regularesSorteio.filter(j => j.nome !== parForcado.nome);
                    } else {
                         const forcaT1 = times[0].jogadores.reduce((s, p) => s + p.nivel, 0);
                         const forcaT2 = times[1].jogadores.reduce((s, p) => s + p.nivel, 0);
                         if (forcaT1 <= forcaT2) { times[0].jogadores.push(pontuaisDoNivel[0]); } else { times[1].jogadores.push(pontuaisDoNivel[0]); }
                    }
                } else if (pontuaisDoNivel.length === 2) {
                    let par = shuffleArray(pontuaisDoNivel);
                    times[0].jogadores.push(par[0]);
                    times[1].jogadores.push(par[1]);
                }
                
                const timesRegularesDisponiveis = numeroDeTimes - timeInicialRegular;
                if (timesRegularesDisponiveis > 0) {
                    shuffleArray(regularesDoNivel);
                    regularesDoNivel.forEach((jogador, index) => {
                        if (index < timesRegularesDisponiveis) { times[timeInicialRegular + index].jogadores.push(jogador); } 
                        else { listaRepescagem.push(jogador); }
                    });
                } else {
                    listaRepescagem.push(...regularesDoNivel);
                }
            }
            
            shuffleArray(listaRepescagem);
            while (listaRepescagem.length > 0) {
                times.sort((a, b) => a.jogadores.length - b.jogadores.length);
                const timeAlvo = times.find(t => t.jogadores.length < 5);
                if (timeAlvo) { timeAlvo.jogadores.push(listaRepescagem.shift()); } 
                else { grupoDosProximos.push(...listaRepescagem); break; }
            }
            
            if (grupoDosProximos.length > 0) {
                times.push({ id: numeroDeTimes + 1, jogadores: grupoDosProximos });
            }

            times.sort((a, b) => a.id - b.id);
            renderizarResultado(times);
        }

        function renderizarResultado(times) {
            let html = `<button onclick="copiarParaWhatsapp(${JSON.stringify(times).replace(/"/g, '&quot;')})">Copiar para WhatsApp</button>`;
            times.forEach(time => {
                const forca = time.jogadores.reduce((sum, j) => sum + j.nivel, 0);
                time.jogadores.sort((a, b) => b.nivel - a.nivel);
                const jogadoresListaHTML = time.jogadores.map(j => `<li class="nivel-${j.nivel}">${j.nome}${j.pontual ? ' ★' : ''}</li>`).join('');
                const titulo = time.id > Math.floor(coletarDadosFinais().length / 5) || (coletarDadosFinais().length % 5 > 0 && time.id === times.length) ? `Time ${time.id} (Próximos / ${time.jogadores.length})` : `Time ${time.id} (Força Total: ${forca})`;
                html += `<div class="time"><h4>${titulo}</h4><ul>${jogadoresListaHTML}</ul></div>`;
            });
            document.getElementById('resultadoSorteio').innerHTML = html;
        }
        
        function copiarParaWhatsapp(times) {
            let texto = '⚽ *SORTEIO DE TIMES RESENHA FUTS* ⚽\n\n';
            times.forEach(time => {
                const forca = time.jogadores.reduce((sum, j) => sum + j.nivel, 0);
                const tituloTime = time.id > Math.floor(coletarDadosFinais().length / 5) || (coletarDadosFinais().length % 5 > 0 && time.id === times.length) ? `*Time ${time.id}* (Próximos)`: `*Time ${time.id}* (Força: ${forca})`;
                texto += `--- ${tituloTime} ---\n`;
                time.jogadores.sort((a, b) => b.nivel - a.nivel);
                time.jogadores.forEach(j => { texto += `- ${j.nome}${j.pontual ? ' ★' : ''}\n`; });
                texto += '\n';
            });
            navigator.clipboard.writeText(texto).then(() => alert('Resultado copiado!')).catch(err => alert('Erro ao copiar.'));
        }
    </script>
</body>
</html>
